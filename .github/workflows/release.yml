# Builds the signed APK for a version tag and publishes it as a GitHub release, which the app then offers
# as an update. Push a tag to release:  git tag v1.2.0 && git push origin v1.2.0
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   TMDB_ACCESS_TOKEN       the TMDB read access token, built into the app as for a local build
#   RELEASE_KEYSTORE_BASE64 the keystore file, base64-encoded (base64 -i codexcine.jks | pbcopy)
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
#   RELEASES_TOKEN          only when releases go to another repository: a token allowed to write its contents
# Repository variable:
#   UPDATE_REPOSITORY       "owner/name" of the public repository the app checks; empty: this one
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      UPDATE_REPOSITORY: ${{ vars.UPDATE_REPOSITORY || github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing and TMDB settings
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "TMDB_ACCESS_TOKEN=$TMDB_ACCESS_TOKEN"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } > local.properties

      - name: Tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Signed APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease -PappVersion="$TAG" -PupdateRepository="$UPDATE_REPOSITORY"
          mv app/build/outputs/apk/release/app-release.apk "CodexCine-$TAG.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          gh release create "$TAG" "CodexCine-$TAG.apk" \
            --repo "$UPDATE_REPOSITORY" \
            --title "Codex Ciné $TAG" \
            --notes "$(git tag -l --format='%(contents)' "$TAG")"

      - name: Remove the signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" local.properties
